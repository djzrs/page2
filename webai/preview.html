
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浏览器 AI 图像识别 - MobileNetV4</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 16px;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  background: #f4f6f9;
  color: #263238;
}

.container {
  max-width: 760px;
  margin: 0 auto;
  background: #fff;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,.06);
}

h1 {
  margin: 0 0 10px;
  font-size: 25px;
}

.desc {
  color: #718096;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 24px;
}

.status {
  padding: 12px 15px;
  border-radius: 8px;
  background: #edf2f7;
  color: #4a5568;
  font-size: 14px;
  margin-bottom: 20px;
}

.status.success {
  background: #e6fffa;
  color: #087f68;
}

.status.error {
  background: #fff0f0;
  color: #c53030;
}

.upload {
  display: block;
  border: 2px dashed #cbd5e0;
  border-radius: 12px;
  padding: 28px;
  text-align: center;
  cursor: pointer;
  color: #64748b;
  transition: .2s;
}

.upload:hover {
  border-color: #3182ce;
  background: #f7fbff;
}

.upload input {
  display: none;
}

.preview {
  display: none;
  margin-top: 20px;
  text-align: center;
}

.preview img {
  max-width: 100%;
  max-height: 350px;
  border-radius: 10px;
  object-fit: contain;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

button {
  flex: 1;
  border: 0;
  border-radius: 9px;
  padding: 13px 16px;
  font-size: 15px;
  cursor: pointer;
  background: #3182ce;
  color: white;
}

button.secondary {
  background: #e2e8f0;
  color: #334155;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.results {
  margin-top: 25px;
}

.result-item {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 14px 0;
}

.rank {
  width: 28px;
  color: #718096;
  font-weight: bold;
}

.result-content {
  flex: 1;
}

.result-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 14px;
}

.bar {
  height: 8px;
  background: #edf2f7;
  border-radius: 10px;
  overflow: hidden;
}

.bar-inner {
  height: 100%;
  background: #3182ce;
  border-radius: 10px;
}

.debug {
  margin-top: 25px;
  padding: 15px;
  border-radius: 10px;
  background: #f7fafc;
  font-size: 13px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.debug h3 {
  margin: 0 0 8px;
}

.debug pre {
  white-space: pre-wrap;
  margin: 0;
  color: #475569;
}

.footer {
  margin-top: 25px;
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
}

@media(max-width: 520px) {
  .container {
    padding: 20px;
  }
  .buttons {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>AI 图像识别</h1>

  <div class="desc">
    基于 MobileNetV4 和 ONNX Runtime Web。
    模型在浏览器本地运行，图片不会上传到服务器。
  </div>

  <div id="status" class="status">
    正在初始化……
  </div>

  <label class="upload">
    <input type="file" id="fileInput" accept="image/*">
    <div style="font-size:36px;margin-bottom:10px;">📷</div>
    <strong>点击选择图片</strong>
    <div style="font-size:13px;margin-top:8px;">
      支持 JPG、PNG、WebP 等常见图片
    </div>
  </label>

  <div class="preview" id="preview">
    <img id="previewImage" alt="待识别图片">
    <div id="imageInfo" style="margin-top:8px;font-size:13px;color:#718096;"></div>
  </div>

  <div class="buttons">
    <button id="loadButton">加载模型</button>
    <button id="runButton" disabled>开始识别</button>
  </div>

  <div class="results" id="results"></div>

  <div class="debug">
    <h3>调试信息</h3>
    <pre id="debugInfo">等待模型加载……</pre>
  </div>

  <div class="footer">
    MobileNetV4 · ONNX Runtime Web · Browser AI
    <div>v1</div>
  </div>

</div>

<script type="module">

import * as ort from
"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.mjs";

// ===============================
// 1. 模型文件地址
// ===============================

const BASE_URL =
"https://pages.maikemaker.eu.org/page2/webai/models/onnx-community/mobilenetv4_conv_small.e2400_r224_in1k/";

const MODEL_URL =
BASE_URL + "onnx/model_quantized.onnx";

const CONFIG_URL =
BASE_URL + "config.json";

const PREPROCESS_URL =
BASE_URL + "preprocessor_config.json";

const SIZE = 224;
const RESIZE_SIZE = 256;

// ===============================
// 2. 全局变量
// ===============================

let session = null;
let config = null;
let preprocessConfig = null;
let selectedImage = null;

const statusEl = document.getElementById("status");
const debugEl = document.getElementById("debugInfo");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");
const imageInfo = document.getElementById("imageInfo");
const loadButton = document.getElementById("loadButton");
const runButton = document.getElementById("runButton");
const resultsEl = document.getElementById("results");

// ===============================
// 3. 状态显示
// ===============================

function setStatus(message, type = "") {
  statusEl.textContent = message;
  statusEl.className = "status " + type;
}

function setDebug(message) {
  debugEl.textContent = message;
}

// ===============================
// 4. 加载 JSON
// ===============================

async function loadJSON(url) {
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(
      "文件加载失败：" + url + "，HTTP " + response.status
    );
  }

  return await response.json();
}

// ===============================
// 5. 加载模型
// ===============================

async function loadModel() {

  if (session) {
    setStatus("模型已经加载完成", "success");
    return;
  }

  loadButton.disabled = true;
  setStatus("正在加载模型，请稍候……");

  try {

    console.log("开始加载模型配置");

    config = await loadJSON(CONFIG_URL);
    preprocessConfig = await loadJSON(PREPROCESS_URL);

    console.log("模型配置：", config);
    console.log("预处理配置：", preprocessConfig);

    setStatus("正在下载 ONNX 模型……");

    const response = await fetch(MODEL_URL);

    if (!response.ok) {
      throw new Error("ONNX 模型下载失败，HTTP " + response.status);
    }

    const modelBuffer = await response.arrayBuffer();

    console.log("模型文件大小：", modelBuffer.byteLength);

    session = await ort.InferenceSession.create(
      modelBuffer,
      {
        executionProviders: ["wasm"]
      }
    );

    // Session 创建成功后再读取信息
    console.log("模型输入信息：", session.inputMetadata);
    console.log("模型输入名称：", session.inputNames);
    console.log("模型输出名称：", session.outputNames);

    setDebug(
      "模型加载成功\n\n" +
      "输入名称：" + session.inputNames.join(", ") + "\n" +
      "输出名称：" + session.outputNames.join(", ") + "\n" +
      "模型文件大小：" + modelBuffer.byteLength + " bytes\n\n" +
      "输入信息：\n" +
      JSON.stringify(session.inputMetadata, null, 2)
    );

    setStatus("模型加载成功，可以开始识别", "success");

    if (selectedImage) {
      runButton.disabled = false;
    }

  } catch (error) {

    console.error("模型加载错误：", error);

    setStatus("模型加载失败：" + error.message, "error");

    setDebug(error.stack || error.message);

    session = null;

  } finally {

    loadButton.disabled = false;

  }
}

// ===============================
// 6. 图片上传
// ===============================

fileInput.addEventListener("change", event => {

  const file = event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    setStatus("请选择有效的图片文件", "error");
    return;
  }

  const url = URL.createObjectURL(file);

  const img = new Image();

  img.onload = () => {

    selectedImage = img;

    previewImage.src = url;

    preview.style.display = "block";

    imageInfo.textContent =
      "原始尺寸：" + img.naturalWidth +
      " × " + img.naturalHeight;

    resultsEl.innerHTML = "";

    setStatus(
      session ? "图片已选择，可以开始识别" : "图片已选择，请先加载模型"
    );

    runButton.disabled = !session;

  };

  img.onerror = () => {
    URL.revokeObjectURL(url);
    setStatus("图片读取失败", "error");
  };

  img.src = url;

});

// ===============================
// 7. 图片预处理
// ===============================

function preprocessImage(img) {

  const sourceWidth = img.naturalWidth;
  const sourceHeight = img.naturalHeight;

  // 按最短边缩放到 256
  const scale = RESIZE_SIZE /
    Math.min(sourceWidth, sourceHeight);

  const resizedWidth = Math.round(sourceWidth * scale);
  const resizedHeight = Math.round(sourceHeight * scale);

  const resizeCanvas = document.createElement("canvas");

  resizeCanvas.width = resizedWidth;
  resizeCanvas.height = resizedHeight;

  const resizeCtx = resizeCanvas.getContext("2d", {
    willReadFrequently: true
  });

  resizeCtx.imageSmoothingEnabled = true;
  resizeCtx.imageSmoothingQuality = "high";

  resizeCtx.drawImage(
    img,
    0,
    0,
    resizedWidth,
    resizedHeight
  );

  // 中心裁剪 224 × 224
  const cropX = Math.floor((resizedWidth - SIZE) / 2);
  const cropY = Math.floor((resizedHeight - SIZE) / 2);

  const cropCanvas = document.createElement("canvas");

  cropCanvas.width = SIZE;
  cropCanvas.height = SIZE;

  const cropCtx = cropCanvas.getContext("2d", {
    willReadFrequently: true
  });

  cropCtx.drawImage(
    resizeCanvas,
    cropX,
    cropY,
    SIZE,
    SIZE,
    0,
    0,
    SIZE,
    SIZE
  );

  const imageData = cropCtx.getImageData(
    0,
    0,
    SIZE,
    SIZE
  );

  const pixels = imageData.data;

  const mean = preprocessConfig.image_mean || [
    0.485, 0.456, 0.406
  ];

  const std = preprocessConfig.image_std || [
    0.229, 0.224, 0.225
  ];

  const rescaleFactor =
    preprocessConfig.rescale_factor || (1 / 255);

  // NCHW 格式
  const tensorData = new Float32Array(
    3 * SIZE * SIZE
  );

  const channelSize = SIZE * SIZE;

  for (let y = 0; y < SIZE; y++) {

    for (let x = 0; x < SIZE; x++) {

      const pixelIndex = (y * SIZE + x) * 4;

      const tensorIndex = y * SIZE + x;

      const r = pixels[pixelIndex] * rescaleFactor;
      const g = pixels[pixelIndex + 1] * rescaleFactor;
      const b = pixels[pixelIndex + 2] * rescaleFactor;

      tensorData[tensorIndex] =
        (r - mean[0]) / std[0];

      tensorData[channelSize + tensorIndex] =
        (g - mean[1]) / std[1];

      tensorData[channelSize * 2 + tensorIndex] =
        (b - mean[2]) / std[2];

    }

  }

  // 创建 ONNX 输入张量
  const inputTensor = new ort.Tensor(
    "float32",
    tensorData,
    [1, 3, SIZE, SIZE]
  );

  // ===============================
  // 调试信息
  // ===============================

  let min = Infinity;
  let max = -Infinity;
  let sum = 0;

  for (const value of tensorData) {
    if (value < min) min = value;
    if (value > max) max = value;
    sum += value;
  }

  console.log("输入张量维度：", inputTensor.dims);
  console.log("输入张量类型：", inputTensor.type);
  console.log("输入数据范围：", { min, max });
  console.log("输入数据长度：", tensorData.length);
  console.log("输入数据平均值：", sum / tensorData.length);

  console.log("缩放后尺寸：", resizedWidth, resizedHeight);
  console.log("中心裁剪位置：", cropX, cropY);

  setDebug(
    "图片预处理完成\n\n" +
    "原始图片：" + sourceWidth + " × " + sourceHeight + "\n" +
    "缩放尺寸：" + resizedWidth + " × " + resizedHeight + "\n" +
    "裁剪位置：" + cropX + ", " + cropY + "\n" +
    "裁剪尺寸：224 × 224\n\n" +
    "输入张量维度：" + JSON.stringify(inputTensor.dims) + "\n" +
    "输入张量类型：" + inputTensor.type + "\n" +
    "数据长度：" + tensorData.length + "\n" +
    "数据范围：" + min.toFixed(4) + " ~ " + max.toFixed(4) + "\n" +
    "数据平均值：" + (sum / tensorData.length).toFixed(4)
  );

  return inputTensor;

}

// ===============================
// 8. Softmax
// ===============================

function softmax(logits) {

  const max = Math.max(...logits);

  const exps = logits.map(value =>
    Math.exp(value - max)
  );

  const sum = exps.reduce(
    (a, b) => a + b,
    0
  );

  return exps.map(value => value / sum);

}

// ===============================
// 9. 分类识别
// ===============================

async function classifyImage() {

  if (!session) {
    setStatus("请先加载模型", "error");
    return;
  }

  if (!selectedImage) {
    setStatus("请先选择图片", "error");
    return;
  }

  runButton.disabled = true;

  setStatus("正在进行图像识别……");

  resultsEl.innerHTML = "";

  try {

    // 生成输入张量
    const inputTensor = preprocessImage(selectedImage);

    const inputName = session.inputNames[0];
    const outputName = session.outputNames[0];

    // 执行模型推理
    const output = await session.run({
      [inputName]: inputTensor
    });

    console.log("模型输出维度：", output[outputName].dims);

    const logits = Array.from(output[outputName].data);

    console.log("Logits 数量：", logits.length);

    // Softmax
    const probabilities = softmax(logits);

    // 排序取 Top 5
    const topResults = probabilities
      .map((score, index) => ({
        index,
        score,
        label: config.id2label?.[index] ??
          config.id2label?.[String(index)] ??
          ("类别 " + index)
      }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 5);

    console.log("Top 5 分类结果：", topResults);

    // 显示分类结果
    resultsEl.innerHTML = "<h3>识别结果 Top 5</h3>";

    topResults.forEach((item, index) => {

      const percentage = (item.score * 100).toFixed(2);

      const row = document.createElement("div");
      row.className = "result-item";

      const rank = document.createElement("div");
      rank.className = "rank";
      rank.textContent = index + 1;

      const content = document.createElement("div");
      content.className = "result-content";

      const label = document.createElement("div");
      label.className = "result-label";

      const name = document.createElement("span");
      name.textContent = item.label;

      const score = document.createElement("strong");
      score.textContent = percentage + "%";

      label.append(name, score);

      const bar = document.createElement("div");
      bar.className = "bar";

      const barInner = document.createElement("div");
      barInner.className = "bar-inner";
      barInner.style.width = percentage + "%";

      bar.appendChild(barInner);

      content.append(label, bar);
      row.append(rank, content);

      resultsEl.appendChild(row);

    });

    setStatus("识别完成", "success");

    setDebug(
      debugEl.textContent +
      "\n\n模型输出维度：" +
      JSON.stringify(output[outputName].dims) +
      "\nLogits 数量：" + logits.length +
      "\n\nTop 5 分类结果：\n" +
      JSON.stringify(topResults, null, 2)
    );

  } catch (error) {

    console.error("识别错误：", error);

    setStatus("识别失败：" + error.message, "error");

    setDebug(
      debugEl.textContent +
      "\n\n识别错误：\n" +
      (error.stack || error.message)
    );

  } finally {

    runButton.disabled = false;

  }

}

// ===============================
// 10. 按钮事件
// ===============================

loadButton.addEventListener("click", loadModel);

runButton.addEventListener("click", classifyImage);

// 页面初始化
setStatus("请选择图片，然后加载模型");

</script>

</body>
</html>
