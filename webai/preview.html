
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MobileNetV4 浏览器图像分类</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 30px 15px;
  background: #f3f5f9;
  color: #202938;
  font-family: Arial, "Microsoft YaHei", sans-serif;
}

main {
  max-width: 680px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 26px;
}

.desc {
  text-align: center;
  color: #64748b;
  font-size: 14px;
  margin-bottom: 25px;
}

.panel {
  background: white;
  padding: 22px;
  margin-bottom: 18px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #00000008;
}

h2 {
  font-size: 17px;
  margin: 0 0 15px;
}

#status {
  padding: 13px;
  border-radius: 8px;
  background: #f1f5f9;
  color: #475569;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

#status.success {
  background: #ecfdf5;
  color: #047857;
}

#status.error {
  background: #fef2f2;
  color: #b91c1c;
}

.buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 15px;
}

button, .upload {
  display: inline-block;
  padding: 11px 20px;
  border: none;
  border-radius: 7px;
  background: #2563eb;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

button:disabled {
  background: #94a3b8;
  cursor: not-allowed;
}

input[type=file] {
  display: none;
}

.preview {
  min-height: 180px;
  background: #f8fafc;
  border: 2px dashed #cbd5e1;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.preview img {
  display: none;
  max-width: 100%;
  max-height: 350px;
  object-fit: contain;
}

.placeholder {
  color: #94a3b8;
  font-size: 14px;
  text-align: center;
  padding: 25px;
}

.result {
  margin-top: 18px;
}

.result-row {
  margin-bottom: 17px;
}

.result-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 7px;
  font-size: 14px;
}

.result-title strong {
  overflow-wrap: anywhere;
}

.percent {
  color: #64748b;
  white-space: nowrap;
}

.track {
  height: 9px;
  background: #e2e8f0;
  border-radius: 20px;
  overflow: hidden;
}

.bar {
  height: 100%;
  background: #2563eb;
}

.footer {
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.8;
  margin-top: 25px;
}
</style>
</head>

<body>

<main>

<h1>浏览器 AI 图像分类</h1>
<div class="desc">
  MobileNetV4 · ONNX Runtime Web · 本地浏览器推理
</div>

<section class="panel">
  <h2>一、模型状态</h2>

  <div id="status">等待加载模型...</div>

  <div class="buttons">
    <button id="loadBtn">加载模型</button>
  </div>
</section>

<section class="panel">
  <h2>二、选择图片</h2>

  <div class="preview">
    <div id="placeholder" class="placeholder">
      选择一张图片进行识别
    </div>
    <img id="previewImg" alt="图片预览">
  </div>

  <div class="buttons">
    <label class="upload" for="fileInput">选择图片</label>
    <input type="file" id="fileInput" accept="image/*">

    <button id="runBtn" disabled>开始识别</button>
  </div>
</section>

<section class="panel">
  <h2>三、识别结果（Top 5）</h2>
  <div id="results" style="color:#94a3b8;font-size:14px">
    等待识别...
  </div>
</section>

<div class="footer">
  模型：MobileNetV4 Conv Small<br>
  数据集：ImageNet-1K（1000 类）<br>
  模型托管：GitHub Pages
</div>

</main>

<script type="module">

// ========================================
// 1. 导入 ONNX Runtime
// ========================================

import * as ort from
"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.mjs";

// ========================================
// 2. 模型地址
// ========================================

const BASE =
"https://pages.maikemaker.eu.org/page2/webai/models/onnx-community/mobilenetv4_conv_small.e2400_r224_in1k/";

const MODEL_URL = BASE + "onnx/model_quantized.onnx";
const CONFIG_URL = BASE + "config.json";
const PREPROCESS_URL = BASE + "preprocessor_config.json";

// ========================================
// 3. 页面元素
// ========================================

const status = document.getElementById("status");
const loadBtn = document.getElementById("loadBtn");
const runBtn = document.getElementById("runBtn");
const fileInput = document.getElementById("fileInput");
const previewImg = document.getElementById("previewImg");
const placeholder = document.getElementById("placeholder");
const results = document.getElementById("results");

let session = null;
let labels = {};
let selectedImage = null;
let objectURL = null;

// ========================================
// 4. 加载模型和配置
// ========================================

loadBtn.onclick = async () => {

  loadBtn.disabled = true;
  status.className = "";
  status.textContent = "正在下载模型和配置文件...";

  try {

    // 下载模型配置
    const configResponse = await fetch(CONFIG_URL);

    if (!configResponse.ok) {
      throw new Error("config.json 下载失败：" + configResponse.status);
    }

    const config = await configResponse.json();
    labels = config.id2label || {};

    // 读取预处理配置
    const preprocessResponse = await fetch(PREPROCESS_URL);

    if (!preprocessResponse.ok) {
      throw new Error("preprocessor_config.json 下载失败：" + preprocessResponse.status);
    }

    const preprocess = await preprocessResponse.json();

    // 下载 ONNX 模型
    status.textContent = "正在下载 ONNX 模型...";

    const modelResponse = await fetch(MODEL_URL);

    if (!modelResponse.ok) {
      throw new Error("模型下载失败：" + modelResponse.status);
    }

    const modelBuffer = await modelResponse.arrayBuffer();

    status.textContent =
      "模型下载成功，大小：" +
      (modelBuffer.byteLength / 1024 / 1024).toFixed(2) +
      " MB\n正在初始化推理引擎...";

    // 创建 ONNX Session
    session = await ort.InferenceSession.create(
      modelBuffer,
      {
        executionProviders: ["wasm"]
      }
    );

    // 保存预处理参数
    window.modelPreprocess = preprocess;

    status.className = "success";

    status.textContent =
      "模型加载成功！\n" +
      "输入：" + session.inputNames.join(", ") + "\n" +
      "输出：" + session.outputNames.join(", ") + "\n" +
      "类别数量：" + Object.keys(labels).length;

    loadBtn.textContent = "模型已加载";

    runBtn.disabled = !selectedImage;

    console.log("模型配置：", config);
    console.log("预处理配置：", preprocess);
    console.log("ONNX Session：", session);

  } catch (error) {

    console.error(error);

    status.className = "error";
    status.textContent = "加载失败：\n" + error.message;

    session = null;
    loadBtn.disabled = false;
    loadBtn.textContent = "重新加载模型";
  }
};

// ========================================
// 5. 图片选择
// ========================================

fileInput.onchange = () => {

  const file = fileInput.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("请选择图片文件");
    return;
  }

  if (objectURL) {
    URL.revokeObjectURL(objectURL);
  }

  objectURL = URL.createObjectURL(file);

  const image = new Image();

  image.onload = () => {

    selectedImage = image;

    previewImg.src = objectURL;
    previewImg.style.display = "block";
    placeholder.style.display = "none";

    runBtn.disabled = !session;

    results.textContent =
      session ? "图片已准备好，可以开始识别。" : "请先加载模型。";
  };

  image.onerror = () => {
    alert("图片读取失败");
  };

  image.src = objectURL;
};

// ========================================
// 6. 图片预处理
// ========================================

function preprocessImage(image) {

  const SIZE = 224;
  const RESIZE_SHORT = 256;

  // 按短边缩放至 256
  const scale = RESIZE_SHORT /
    Math.min(image.width, image.height);

  const resizedWidth = Math.round(image.width * scale);
  const resizedHeight = Math.round(image.height * scale);

  const canvas = document.createElement("canvas");

  canvas.width = SIZE;
  canvas.height = SIZE;

  const ctx = canvas.getContext("2d", {
    willReadFrequently: true
  });

  // 高质量缩放
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  // 中心裁剪 224 × 224
  const sx = (resizedWidth - SIZE) / 2;
  const sy = (resizedHeight - SIZE) / 2;

  ctx.drawImage(
    image,
    0, 0, image.width, image.height,
    -sx, -sy, resizedWidth, resizedHeight
  );

  const pixels = ctx.getImageData(
    0, 0, SIZE, SIZE
  ).data;

  // ImageNet 标准化参数
  const mean = [0.485, 0.456, 0.406];
  const std = [0.229, 0.224, 0.225];

  // NCHW: [1, 3, 224, 224]
  const tensorData = new Float32Array(
    3 * SIZE * SIZE
  );

  for (let i = 0; i < SIZE * SIZE; i++) {

    const r = pixels[i * 4] / 255;
    const g = pixels[i * 4 + 1] / 255;
    const b = pixels[i * 4 + 2] / 255;

    tensorData[i] =
      (r - mean[0]) / std[0];

    tensorData[SIZE * SIZE + i] =
      (g - mean[1]) / std[1];

    tensorData[2 * SIZE * SIZE + i] =
      (b - mean[2]) / std[2];
  }

  return new ort.Tensor(
    "float32",
    tensorData,
    [1, 3, SIZE, SIZE]
  );
}

// ========================================
// 7. Softmax
// ========================================

function softmax(logits) {

  const max = Math.max(...logits);

  const exps = logits.map(
    value => Math.exp(value - max)
  );

  const sum = exps.reduce(
    (a, b) => a + b, 0
  );

  return exps.map(value => value / sum);
}

// ========================================
// 8. 图片分类
// ========================================

runBtn.onclick = async () => {

  if (!session || !selectedImage) return;

  runBtn.disabled = true;
  runBtn.textContent = "识别中...";

  results.textContent = "正在进行图片推理...";

  try {

    // 图片预处理
    const inputTensor = preprocessImage(selectedImage);

    // 执行推理
    const inputName = session.inputNames[0];

    const output = await session.run({
      [inputName]: inputTensor
    });

    // 获取 logits
    const outputName = session.outputNames[0];
    const logits = Array.from(output[outputName].data);

    // Softmax 转概率
    const probabilities = softmax(logits);

    // 排序取前 5
    const topResults = probabilities
      .map((score, index) => ({
        index,
        score,
        label: labels[String(index)] || ("类别 " + index)
      }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 5);

    console.log("分类结果：", topResults);

    // 显示结果
    results.innerHTML = topResults.map((item, i) => {

      const percent = item.score * 100;

      const safeLabel = escapeHTML(item.label);

      return `
        <div class="result-row">
          <div class="result-title">
            <strong>${i + 1}. ${safeLabel}</strong>
            <span class="percent">${percent.toFixed(2)}%</span>
          </div>
          <div class="track">
            <div class="bar" style="width:${percent}%"></div>
          </div>
        </div>
      `;

    }).join("");

  } catch (error) {

    console.error(error);

    results.textContent =
      "识别失败：" + error.message;

  } finally {

    runBtn.disabled = false;
    runBtn.textContent = "开始识别";
  }
};

// ========================================
// 9. HTML 安全转义
// ========================================

function escapeHTML(value) {

  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

</script>

</body>
</html>
