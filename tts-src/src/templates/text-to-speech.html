<div class="task-container tts-app">
  <!-- 左侧控制区 -->
  <div class="controls-panel">
    <div class="section-title">模型选择</div>
    <div id="model-selector-container"></div>

    <div class="divider"></div>

    <div class="section-title">设置</div>

    <div class="control-group">
      <div class="control-label">
        <span>发音人</span>
      </div>
      <div class="select-wrapper">
        <select id="voice-select" disabled>
          <option value="">请先加载模型</option>
        </select>
      </div>
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>语速</span>
        <span id="speaking-rate-value" class="value-badge">1.0</span>
      </div>
      <input type="range" id="speaking-rate" min="0.5" max="2" step="0.1" value="1" class="range-slider" />
      <div class="control-hint">重新加载模型后生效。</div>
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>运行设备</span>
      </div>
      <div class="select-wrapper">
        <select id="delegate-select">
          <option value="GPU" selected>GPU</option>
          <option value="CPU">CPU</option>
        </select>
      </div>
      <div id="gpu-status" class="gpu-status" aria-live="polite">
        <span class="gpu-status-dot"></span><span id="gpu-status-text">正在检测 GPU…</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="status-group">
      <div id="status-message" class="status-message">就绪</div>
      <div id="inference-time" class="inference-time">推理耗时：- 毫秒</div>
    </div>
  </div>

  <!-- 右侧输出区 -->
  <div class="output-panel">
    <div class="output-header">
      <h2>中文语音合成</h2>
    </div>

    <div class="viewport tts-viewport">
      <div class="tts-card">
        <div class="preset-bar" id="tts-samples">
          <span class="preset-bar-label">示例</span>
          <button class="sample-chip active" data-sample="welcome">欢迎语</button>
          <button class="sample-chip" data-sample="story">小故事</button>
          <button class="sample-chip" data-sample="numbers">数字与日期</button>
          <button class="sample-chip" data-sample="article">多段文章</button>
        </div>

        <textarea
          id="tts-text-input"
          class="slot-textarea"
          rows="5"
          placeholder="输入或粘贴要朗读的文字……"
        ></textarea>

        <div class="tts-actions">
          <button
            id="tts-stream-btn"
            class="action-button"
            title="边合成边播放：首个片段生成后立即播放，其余文本继续在后台合成。"
            disabled
          >
            <span class="material-icons">graphic_eq</span> 流式播放
          </button>
          <button
            id="tts-speak-btn"
            class="action-button secondary"
            title="先把整段文字合成为一个音频再播放。想更快听到声音请用「流式播放」。"
            disabled
          >
            <span class="material-icons">record_voice_over</span> 合成全部
          </button>
          <button id="tts-stop-btn" class="action-button secondary" disabled>
            <span class="material-icons">stop</span> 停止
          </button>
          <button id="tts-download-btn" class="action-button secondary" disabled>
            <span class="material-icons">download</span> 导出 WAV
          </button>
        </div>
      </div>

      <div id="tts-output" class="tts-output">
        <div class="audio-visualizer-container">
          <canvas id="tts-waveform"></canvas>
        </div>

        <div class="tts-metrics">
          <div class="tts-metric">
            <span class="tts-metric-label">首字延迟</span>
            <span id="tts-metric-first" class="tts-metric-value">-</span>
          </div>
          <div class="tts-metric">
            <span class="tts-metric-label">合成耗时</span>
            <span id="tts-metric-total" class="tts-metric-value">-</span>
          </div>
          <div class="tts-metric">
            <span class="tts-metric-label">音频时长</span>
            <span id="tts-metric-audio" class="tts-metric-value">-</span>
          </div>
          <div class="tts-metric">
            <span class="tts-metric-label">实时率</span>
            <span id="tts-metric-rtf" class="tts-metric-value">-</span>
          </div>
        </div>

        <div class="tts-reader-bar">
          <div class="tts-reader-hint" title="点击任意句子即可从该句开始朗读">
            <span class="material-icons" style="font-size: 16px; flex-shrink: 0">touch_app</span>
            <span class="tts-reader-hint-text">点击任意句子即可从该句开始朗读</span>
          </div>
          <div class="tts-reader-controls">
            <span id="tts-sentence-badge" class="tts-sentence-badge"></span>
            <button id="tts-prev-sent-btn" type="button" class="tts-nav-btn" title="上一句" disabled>
              <span class="material-icons" style="font-size: 16px">skip_previous</span>
              <span>上一句</span>
            </button>
            <button id="tts-next-sent-btn" type="button" class="tts-nav-btn" title="下一句" disabled>
              <span>下一句</span>
              <span class="material-icons" style="font-size: 16px">skip_next</span>
            </button>
          </div>
        </div>

        <div id="tts-transcript" class="tts-transcript" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <style>
    /* ================= 容器与分栏 ================= */
    .tts-app {
      display: flex;
      height: 100%;
      width: 100%;
    }
    .tts-app .controls-panel {
      width: 340px;
      max-width: 340px;
    }

    .tts-viewport {
      justify-content: flex-start !important;
      padding: 20px;
      gap: 16px;
    }

    .tts-card,
    .tts-output {
      width: 100%;
      max-width: 720px;
    }

    .tts-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .tts-actions .action-button {
      margin-top: 0;
    }

    .tts-output .audio-visualizer-container {
      margin-top: 0;
    }

    #tts-waveform {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ================= GPU 状态徽标 ================= */
    .gpu-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 500;
      line-height: 1.4;
      background: #f1f3f4;
      color: var(--text-secondary);
      width: fit-content;
    }
    .gpu-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #9aa0a6;
    }
    .gpu-status.checking .gpu-status-dot {
      background: #f9ab00;
      animation: gpu-pulse 1s ease-in-out infinite;
    }
    .gpu-status.ok {
      background: #e6f4ea;
      color: #137333;
    }
    .gpu-status.ok .gpu-status-dot {
      background: #34a853;
    }
    .gpu-status.warn {
      background: #fef7e0;
      color: #b06000;
    }
    .gpu-status.warn .gpu-status-dot {
      background: #f9ab00;
    }
    @keyframes gpu-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ================= 指标卡 ================= */
    .tts-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .tts-metric {
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }

    .tts-metric-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .tts-metric-value {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.95rem;
      color: var(--text-main);
      margin-top: 2px;
    }

    /* ================= 逐句朗读栏 ================= */
    .tts-reader-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 8px;
      margin-top: 14px;
      padding: 6px 10px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    }

    .tts-reader-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .tts-reader-hint-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tts-reader-controls {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      gap: 6px;
    }

    .tts-sentence-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary, #00796b);
      padding: 2px 8px;
      background: rgba(0, 151, 167, 0.1);
      border-radius: 999px;
      white-space: nowrap;
    }

    .tts-sentence-badge:empty {
      display: none;
    }

    .tts-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px 8px;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-main);
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .tts-nav-btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: var(--primary, #00796b);
    }

    .tts-nav-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ================= 转录文本与高亮 ================= */
    .tts-transcript {
      margin-top: 0;
      padding: 14px 16px;
      min-height: 64px;
      border: 1px solid var(--border-color);
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      background: #ffffff;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--text-secondary);
    }

    .tts-transcript:empty::before {
      content: '朗读时，每个字词会在此处高亮显示。';
      color: #9aa0a6;
      font-style: italic;
    }

    .tts-paragraph {
      margin: 0 0 10px 0;
    }
    .tts-paragraph:last-child {
      margin-bottom: 0;
    }

    .tts-sentence {
      border-radius: 3px;
      padding: 1px 0;
      cursor: pointer;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .tts-sentence:hover {
      background: rgba(0, 151, 167, 0.08);
      color: var(--text-main);
    }
    .tts-sentence.active {
      background: rgba(0, 151, 167, 0.11);
      color: var(--text-main);
    }
    .tts-sentence.synthesizing {
      background: rgba(245, 158, 11, 0.14);
      color: var(--text-main);
    }
    .tts-sentence.spoken {
      color: var(--text-main);
    }

    .tts-transcript .tts-word {
      border-radius: 3px;
      padding: 1px 0;
      transition: background-color 0.08s ease, box-shadow 0.08s ease;
    }
    .tts-transcript .tts-word.spoken {
      color: var(--text-main);
    }
    .tts-transcript .tts-word.active {
      background: var(--primary-soft, #b2dfdb);
      box-shadow: 0 0 0 2px var(--primary-soft, #b2dfdb);
      color: #004d40;
    }

    .control-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ================= 响应式布局 ================= */
    /* 平板：收窄控制栏 */
    @media (max-width: 1000px) {
      .tts-app .controls-panel {
        width: 300px;
        max-width: 300px;
        padding: 18px;
      }
      .tts-viewport {
        padding: 16px;
      }
    }

    /* 手机：上下堆叠 + 单一文档流滚动，触控友好 */
    @media (max-width: 768px) {
      html, body {
        height: auto !important;
        min-height: 100%;
        overflow: visible !important;
      }
      body {
        overflow-x: hidden !important;
        -webkit-text-size-adjust: 100%;
      }
      #app, .app-container, .main-content {
        height: auto !important;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: visible !important;
      }
      .tts-app {
        flex-direction: column !important;
        height: auto !important;
        overflow: visible !important;
      }
      .tts-app .controls-panel {
        order: 0 !important; /* TTS 需先选模型/发音人，控件放前面 */
        width: 100% !important;
        max-width: 100% !important;
        border-right: none !important;
        border-top: none !important;
        border-bottom: 1px solid var(--border-color) !important;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom)) !important;
        overflow: visible !important;
        gap: 0;
      }
      .tts-app .output-panel {
        order: 1 !important;
        width: 100% !important;
        overflow: visible !important;
        padding: 12px !important;
      }
      .tts-viewport {
        padding: 14px !important;
        gap: 12px !important;
      }
      .tts-card, .tts-output {
        max-width: 100% !important;
      }
      .output-header {
        padding: 14px 16px !important;
      }

      /* 触控目标放大 */
      .tts-actions .action-button,
      .tts-nav-btn,
      .sample-chip {
        min-height: 42px;
      }
      .tts-actions .action-button {
        flex: 1 1 calc(50% - 10px);
        justify-content: center;
        font-size: 0.92rem;
      }
      .range-slider {
        height: 28px;
      }
      select, .select-wrapper select {
        font-size: 16px !important; /* 防止 iOS 聚焦时自动缩放 */
        min-height: 42px;
      }
      textarea#tts-text-input {
        font-size: 16px !important;
        min-height: 120px;
      }
      .preset-bar {
        flex-wrap: wrap;
        gap: 6px;
      }
      .tts-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .tts-reader-bar {
        flex-wrap: wrap;
        row-gap: 8px;
      }
      .tts-reader-hint {
        flex-basis: 100%;
      }
      .tts-reader-controls {
        width: 100%;
        justify-content: flex-end;
      }
    }

    /* 超窄屏 */
    @media (max-width: 380px) {
      .tts-actions .action-button {
        flex-basis: 100%;
      }
      .tts-metric-value {
        font-size: 0.85rem;
      }
    }
  </style>
</div>
